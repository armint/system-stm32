stages:
  - build

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

# One place for the toolchain location. A toolchain bump is a one-line change.
variables:
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# Builds the system-stm32 OBJECT library standalone (no linking needed) for
# every STM32 family this repo claims to support. Each family exercises a
# different CMSIS device header and register layout, so this is the only
# thing that actually catches family-specific regressions (e.g. a fix that
# only works on WL because that's the only family anyone builds downstream).
build:
  stage: build
  variables:
    GIT_DEPTH: 0
  parallel:
    matrix:
      - STM32_FAMILY: STM32L0
        STM32_DEVICE: STM32L073xx
      - STM32_FAMILY: STM32G0
        STM32_DEVICE: STM32G071xx
      # G0B1 has HSI48, CRS and USB; G071 does not, so it compiles none of
      # the HSI48/USB clock code in Rcc.
      - STM32_FAMILY: STM32G0
        STM32_DEVICE: STM32G0B1xx
      - STM32_FAMILY: STM32WL
        STM32_DEVICE: STM32WLE5xx
      - STM32_FAMILY: STM32F1
        STM32_DEVICE: STM32F103xB
  script:
    - cmake -B build -G "Unix Makefiles"
        -D CMAKE_TOOLCHAIN_FILE=cmake/gcc_arm.cmake
        -D GCC_TOOLCHAIN_PREFIX=${GCC_TOOLCHAIN_PREFIX}
        -D CMAKE_BUILD_TYPE=Release
        -D STM32_FAMILY=${STM32_FAMILY}
        -D STM32_DEVICE=${STM32_DEVICE}
    - cmake --build build --target system-stm32 -j$(nproc)

# Builds with SYSTEM_STM32_EXCLUDE_STARTUP=ON, the configuration every
# downstream RTOS consumer (e.g. µOS++ IIIe-based projects) actually uses.
# Catches the class of regression the src/bare-metal/ split guards
# against: a file that should be excluded (or a stale path after moving
# one) breaking this build without ever showing up in the default `build`
# job above, which never sets this option. Only exercised for STM32WL,
# the one family an RTOS consumer currently builds; this can't reproduce
# the multiple-definition link errors this option exists to avoid (that
# needs an actual RTOS on the other end of the link), only that the
# option itself still configures and compiles correctly.
build-exclude-startup:
  stage: build
  variables:
    GIT_DEPTH: 0
    STM32_FAMILY: STM32WL
    STM32_DEVICE: STM32WLE5xx
  script:
    - cmake -B build -G "Unix Makefiles"
        -D CMAKE_TOOLCHAIN_FILE=cmake/gcc_arm.cmake
        -D GCC_TOOLCHAIN_PREFIX=${GCC_TOOLCHAIN_PREFIX}
        -D CMAKE_BUILD_TYPE=Release
        -D STM32_FAMILY=${STM32_FAMILY}
        -D STM32_DEVICE=${STM32_DEVICE}
        -D SYSTEM_STM32_EXCLUDE_STARTUP=ON
    - cmake --build build --target system-stm32 -j$(nproc)

# Links the STM32F1 test image (tests/stm32f1) for both memory scripts. This
# catches link and layout errors that the library-only build cannot see:
# missing symbols, a vector table that does not fit, a section overflow.
# Extend the image when more F1 drivers land (GPIO, USART, ADC, USB).
build-f1-test-image:
  stage: build
  variables:
    GIT_DEPTH: 0
  script:
    - cmake -B build -G "Unix Makefiles"
        -D CMAKE_TOOLCHAIN_FILE=cmake/gcc_arm.cmake
        -D GCC_TOOLCHAIN_PREFIX=${GCC_TOOLCHAIN_PREFIX}
        -D CMAKE_BUILD_TYPE=Release
        -D STM32_FAMILY=STM32F1
        -D STM32_DEVICE=STM32F103xB
        -D SYSTEM_STM32_BUILD_TEST_IMAGE=ON
    - cmake --build build -j$(nproc)
    - for image in test-image-f103x8 test-image-f103xB; do
        ${GCC_TOOLCHAIN_PREFIX}/bin/arm-none-eabi-nm build/tests/stm32f1/${image} | grep -q "^08000000 T g_pfnVectors$" || exit 1;
      done

# STM32C0 is not yet a real target in this repo: GpioInterrupt.cpp has no C0
# branch (#error), Rtc.cpp isn't guarded for C0's smaller RTC register set,
# and VECTOR_TABLE_SIZE is only ever defined for STM32WL. Kept here
# non-blocking so the gap stays visible instead of silently untracked, until
# C0 support is actually implemented.
build-c0-known-broken:
  stage: build
  allow_failure: true
  variables:
    GIT_DEPTH: 0
    STM32_FAMILY: STM32C0
    STM32_DEVICE: STM32C031xx
  script:
    - cmake -B build -G "Unix Makefiles"
        -D CMAKE_TOOLCHAIN_FILE=cmake/gcc_arm.cmake
        -D GCC_TOOLCHAIN_PREFIX=${GCC_TOOLCHAIN_PREFIX}
        -D CMAKE_BUILD_TYPE=Release
        -D STM32_FAMILY=${STM32_FAMILY}
        -D STM32_DEVICE=${STM32_DEVICE}
    - cmake --build build --target system-stm32 -j$(nproc)
